name: Private Dtoon build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: private-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install Android build components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.1'
      - name: Run independent policy tests
        run: bash tools/test-personal.sh
      - name: Check public recommendation API
        continue-on-error: true
        run: python3 tools/check-related-api.py
      - name: Compile app and run Android JVM tests
        run: bash gradlew :app:assembleRelease :app:testReleaseUnitTest -Pdisable-code-shrink --no-daemon
      - name: Prepare offline signing tools
        run: |
          mkdir -p personal/output/signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar" personal/output/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.1/zipalign" personal/output/signing-tools/
          cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk personal/output/
          sha256sum personal/output/app-arm64-v8a-release-unsigned.apk > personal/output/SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: private-unsigned-apk-and-tools
          path: personal/output/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: private-test-results
          path: |
            app/build/test-results/
            personal/output/anilist-api-check.json
          retention-days: 7
