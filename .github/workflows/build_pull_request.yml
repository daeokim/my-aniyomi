name: PR build check
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same checks as the release build, without signing material: pull requests never see secrets.
  build:
    name: Build app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install Android build components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.1'
      - name: Run independent policy tests
        run: bash tools/test-personal.sh
      - name: Sample live genre recommendations
        # Diagnostic report in the job summary; the public catalogue's availability never blocks a PR.
        continue-on-error: true
        timeout-minutes: 5
        run: python3 tools/check-recommendations.py
      - name: Compile app and run Android JVM tests
        run: bash gradlew :domain:testReleaseUnitTest :app:testReleaseUnitTest :app:assembleRelease -Pdisable-code-shrink --no-daemon
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pr-test-results
          path: app/build/test-results/
          retention-days: 7
